<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPS Admin Main</title>
<link rel="manifest" href="/admin.webmanifest">
<link rel="icon" href="/admin-icon.png">
<link rel="apple-touch-icon" href="/admin-icon.png">
<meta name="theme-color" content="#10233f">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#10233f;color:#e8eef6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:460px;margin:0 auto;padding:40px 20px;text-align:center}
  img{width:96px;height:96px}
  h1{font-size:22px;margin:14px 0 6px}
  p{color:#9fb4ce;font-size:15px;line-height:1.4}
  textarea{width:100%;height:110px;margin-top:14px;padding:10px;border-radius:10px;border:1px solid #4f7bb0;background:#1d3a5e;color:#e8eef6;font-size:13px}
  button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#f26a21;color:#fff;font-size:17px;font-weight:600}
  .link{background:none;color:#9fb4ce;font-size:14px;font-weight:400;text-decoration:underline}
  .bad{color:#e25a4f}
</style>
</head>
<body>
<div class="wrap">
  <img src="/admin-icon.png" alt="">
  <h1>FPS Admin Main</h1>
  <div id="go" style="display:none">
    <p>Opening your dashboard…</p>
    <button class="link" onclick="setup()">Change dashboard link</button>
  </div>
  <div id="set" style="display:none">
    <p>Paste your MAIN dashboard link from the email “Your FPS MAIN dashboard link.” It is saved only on this phone.</p>
    <textarea id="u" placeholder="Paste the link here"></textarea>
    <div id="msg" class="bad"></div>
    <button onclick="save()">Save and open</button>
  </div>
</div>
<script>
var K='fps_admin_url', T=null;
function get(){ try{ return localStorage.getItem(K)||''; }catch(e){ return ''; } }
function setup(){ clearTimeout(T); document.getElementById('go').style.display='none';
  document.getElementById('set').style.display='block'; document.getElementById('u').value=get(); }
function save(){
  var v=document.getElementById('u').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec\?.*page=admin/.test(v)){
    document.getElementById('msg').textContent='That doesn’t look like the dashboard link. Copy it from the email and try again.'; return; }
  try{ localStorage.setItem(K,v); }catch(e){}
  location.replace(v);
}
var saved=get();
if(saved && !/[?&]setup=1/.test(location.search)){
  document.getElementById('go').style.display='block';
  T=setTimeout(function(){ location.replace(saved); },1200);
} else setup();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).catch(function(){}); }
</script>
</body>
</html>
